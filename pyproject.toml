[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-studio"
version = "0.1.0"
description = "Local-first YouTube Shorts creation studio: one project format, one FFmpeg render pipeline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jsonschema>=4.23",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "edge-tts>=7.0",
    "yt-dlp[default]>=2026.11.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
ui-test = [
    "playwright>=1.45",
]

[project.scripts]
shorts-studio = "shorts_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["shorts_studio", "shorts_studio.*"]

[tool.setuptools.package-data]
"shorts_studio.speech" = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: runs real FFmpeg renders (slower; needs ffmpeg and ffprobe on PATH)",
]
addopts = "-ra"
